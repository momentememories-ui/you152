<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Anniversary! ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #ffdeeb 0%, #ffafcc 50%, #f72585 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            color: #4a0e17;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Floating Hearts Layer */
        #heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp linear forwards;
            opacity: 0.9;
            filter: drop-shadow(0 2px 5px rgba(255, 105, 180, 0.4));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-50vh) scale(1.2) rotate(15deg);
            }
            100% {
                transform: translateY(-110vh) scale(1) rotate(-15deg);
                opacity: 0;
            }
        }

        /* Mobile App Container (No white border/card background) */
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        /* Page Management */
        .page {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            padding: 20px;
        }

        .page.active {
            display: flex;
            opacity: 1;
        }

        /* Scratch Card Area */
        .scratch-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .scratch-area {
            position: relative;
            width: 300px;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: #fff;
        }

        .scratch-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .scratch-area canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
            transition: opacity 0.5s ease;
        }

        .scratch-instruction {
            font-size: 1.1rem;
            font-weight: 500;
            color: #5c062c;
            text-align: center;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Final Page 5 Style (Full Screen Background) */
        .page-final {
            padding: 0;
            background-image: url('photo5.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Floating Hearts Layer -->
    <div id="heart-container"></div>

    <!-- Audio Element (Auto-played secretly if needed) -->
    <audio id="bg-music" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <!-- Main App Frame -->
    <div class="app-container">

        <!-- PAGE 1 -->
        <div class="page active" id="page-1">
            <div class="scratch-wrapper">
                <div class="scratch-area">
                    <img src="photo1.jpg" alt="Memory 1">
                    <canvas id="canvas-1"></canvas>
                </div>
                <div class="scratch-instruction">ลองขูดดูสิ</div>
            </div>
        </div>

        <!-- PAGE 2 -->
        <div class="page" id="page-2">
            <div class="scratch-wrapper">
                <div class="scratch-area">
                    <img src="photo2.jpg" alt="Memory 2">
                    <canvas id="canvas-2"></canvas>
                </div>
                <div class="scratch-instruction">ลองขูดดูสิ</div>
            </div>
        </div>

        <!-- PAGE 3 -->
        <div class="page" id="page-3">
            <div class="scratch-wrapper">
                <div class="scratch-area">
                    <img src="photo3.jpg" alt="Memory 3">
                    <canvas id="canvas-3"></canvas>
                </div>
                <div class="scratch-instruction">ลองขูดดูสิ</div>
            </div>
        </div>

        <!-- PAGE 4 -->
        <div class="page" id="page-4">
            <div class="scratch-wrapper">
                <div class="scratch-area">
                    <img src="photo4.jpg" alt="Memory 4">
                    <canvas id="canvas-4"></canvas>
                </div>
                <div class="scratch-instruction">ลองขูดดูสิ</div>
            </div>
        </div>

        <!-- PAGE 5 (Full Screen photo5.png) -->
        <div class="page page-final" id="page-5"></div>

    </div>

    <script>
        // Automatic Music Attempt
        const music = document.getElementById('bg-music');
        window.addEventListener('DOMContentLoaded', () => {
            music.play().catch(() => {
                // If browser blocks autoplay, play on first user interaction
                document.addEventListener('touchstart', () => music.play(), { once: true });
                document.addEventListener('click', () => music.play(), { once: true });
            });
        });

        // Floating Hearts Generator
        const heartContainer = document.getElementById('heart-container');
        const heartEmojis = ['❤️', '💖', '💗', '💓', '💕', '🌸', '✨'];

        function spawnHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            heart.style.fontSize = (Math.random() * 15 + 20) + 'px';
            heartContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        let heartInterval = null;
        function startHeartShower() {
            if (!heartInterval) {
                heartInterval = setInterval(spawnHeart, 300);
            }
        }

        function triggerHeartBurst(count = 25) {
            for (let i = 0; i < count; i++) {
                setTimeout(spawnHeart, i * 80);
            }
        }

        // Scratch Card Logic Setup
        function setupScratchCard(canvasId, pageNum, hasHeartsOnComplete) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const width = 300;
            const height = 400;

            canvas.width = width;
            canvas.height = height;

            // Fill Scratch Layer (Silver-Pink Theme)
            ctx.fillStyle = '#ffb7c5';
            ctx.fillRect(0, 0, width, height);

            let isDrawing = false;
            let completed = false;

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            function scratch(e) {
                if (!isDrawing || completed) return;
                if (e.cancelable) e.preventDefault();

                const pos = getPos(e);
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 28, 0, Math.PI * 2);
                ctx.fill();

                checkProgress();
            }

            function checkProgress() {
                if (completed) return;

                const imgData = ctx.getImageData(0, 0, width, height);
                const pixels = imgData.data;
                let transparentPixels = 0;
                const totalPixels = pixels.length / 4;

                for (let i = 3; i < pixels.length; i += 32) {
                    if (pixels[i] === 0) {
                        transparentPixels++;
                    }
                }

                const sampledTotal = totalPixels / 8;
                const percent = (transparentPixels / sampledTotal) * 100;

                if (percent >= 90) {
                    completed = true;
                    ctx.clearRect(0, 0, width, height);

                    if (hasHeartsOnComplete) {
                        triggerHeartBurst(30);
                    }

                    setTimeout(() => {
                        goToPage(pageNum + 1);
                    }, 1500);
                }
            }

            // Event Listeners
            canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
            canvas.addEventListener('mousemove', scratch);
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mouseleave', () => isDrawing = false);

            canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, { passive: false });
            canvas.addEventListener('touchmove', scratch, { passive: false });
            canvas.addEventListener('touchend', () => isDrawing = false);
        }

        // Page Navigation Controller
        function goToPage(nextPageNum) {
            const currentPage = document.querySelector('.page.active');
            const nextPage = document.getElementById(`page-${nextPageNum}`);

            if (currentPage) {
                currentPage.style.opacity = '0';
                setTimeout(() => {
                    currentPage.classList.remove('active');
                    if (nextPage) {
                        nextPage.classList.add('active');
                        setTimeout(() => {
                            nextPage.style.opacity = '1';
                        }, 50);

                        // If Page 5 (Final Page)
                        if (nextPageNum === 5) {
                            triggerHeartBurst(40);
                            startHeartShower();
                        }
                    }
                }, 500);
            }
        }

        // Initialize Scratch Cards
        setupScratchCard('canvas-1', 1, true);
        setupScratchCard('canvas-2', 2, false);
        setupScratchCard('canvas-3', 3, false);
        setupScratchCard('canvas-4', 4, true);
    </script>
</body>
</html>
